name: Verify
on:
  pull_request:
  push:
    branches: [main, stable]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.11'
      - run: python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements-host.txt
      - run: python tests/run.py
      - run: python tests/integration/test_views_runtime.py
      - run: tests/integration/run.sh --enrollment
      - run: tests/integration/run.sh --roster
      - run: tests/integration/run.sh --recovery
      - run: tests/integration/run.sh --lifecycle
      - run: tests/integration/run.sh
