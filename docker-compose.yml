name: matrix-wa

services:
  postgres:
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    restart: unless-stopped
    environment:
      POSTGRES_USER: matrix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: synapse
      # Cluster-wide C locale + UTF8: Synapse requires LC_COLLATE=C, LC_CTYPE=C
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matrix -d synapse"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No host ports: reachable only on the compose network.

  synapse:
    image: ghcr.io/element-hq/synapse:v1.159.0@sha256:edf259d2b575b669a3e81024918ab8d5cfb7d2fba5a53c9e09695f1abc5645cb
    restart: unless-stopped
    environment:
      UID: "501"
      GID: "20"
    volumes:
      - ./synapse:/data
    ports:
      - "127.0.0.1:8008:8008"
    depends_on:
      postgres:
        condition: service_healthy

  mautrix-whatsapp:
    image: dock.mau.dev/mautrix/whatsapp:v26.08@sha256:86237c4d0d33a1e08910b1f820e6c561f9b8e21dc26943caf266e01021087002
    restart: unless-stopped
    environment:
      UID: "501"
      GID: "20"
    volumes:
      - ./whatsapp:/data
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_started
    profiles: ["bridge"]
    # No host ports: appservice listens on the compose network only (29318).

  mautrix-meta:
    # Instagram DM bridge — unified mautrix-meta; network is chosen at login
    # (`login instagram`), not by config (no network.mode field). Pinned 2026-08-26.
    image: dock.mau.dev/mautrix/meta:latest@sha256:61d684f9e385c6150cabe1a49555a409a97a154f2466b45626298de51f1c3f40
    restart: unless-stopped
    environment:
      UID: "501"
      GID: "20"
    volumes:
      - ./meta:/data
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_started
    profiles: ["bridge"]
    # No host ports: appservice listens on the compose network only (29319).

  mautrix-linkedin:
    image: dock.mau.dev/mautrix/linkedin:v0.2608.0@sha256:c10f4e6ed9484ff8053a4e84788d2cc5f9f9c519c91e087afa5179be0ad34d03
    restart: unless-stopped
    environment:
      UID: "501"
      GID: "20"
    volumes:
      - ./linkedin:/data
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_started
    profiles: ["bridge"]
    # No host ports: appservice on the compose network only (29319).

  mautrix-twitter:
    # X (Twitter) DM bridge. Cookie/session login like Instagram & LinkedIn.
    image: dock.mau.dev/mautrix/twitter:latest@sha256:a780515de3c7fa8f410e2d6355d4c69a0c439742c40bafeec8a3d8e61a94cbc4
    restart: unless-stopped
    environment:
      UID: "501"
      GID: "20"
    volumes:
      - ./twitter:/data
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_started
    profiles: ["bridge"]
    # No host ports: appservice listens on the compose network only (29327).

  mautrix-gmessages:
    # Google Messages (SMS/RCS) bridge. Enables double puppeting via the
    # @jkali namespace in gmessages/registration.yaml (exclusive: false).
    image: dock.mau.dev/mautrix/gmessages:v26.08@sha256:cecc0b77bd4d64e6e04b7b5961749e3890daad7885b37e6cde5bb24a07735f3e
    restart: unless-stopped
    environment:
      UID: "501"
      GID: "20"
    volumes:
      - ./gmessages:/data
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_started
    profiles: ["bridge"]
    # No host ports: appservice listens on the compose network only (29336).

  hub:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: unless-stopped
    volumes:
      - ./hub/site:/usr/share/nginx/html:ro
      - ./hub/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8010:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    profiles: ["client"]

  element:
    image: vectorim/element-web:v1.12.26@sha256:a9be04cef41ed94cba0dcaeca5a81f89826d4f8be3d57ba5a6fa988f34eda703
    restart: unless-stopped
    volumes:
      - ./element/config.json:/app/config.json:ro
      - ./element/nginx-default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:8009:80"
    profiles: ["client"]

volumes:
  postgres-data:
