#beepa-crm-integrated .ic-new-list{display:grid;gap:6px;margin-top:8px}
#beepa-crm-integrated .ic-new-list input{width:100%}
#beepa-crm-integrated .rc-info .bc-location button{display:block;padding:3px 0;background:none;border:0;color:var(--bc-accent);font-size:12px}
#beepa-crm-integrated .rc-list-head select{max-width:100%}
@media(max-width:760px){#beepa-crm-integrated .ic-layout{grid-template-columns:48px 145px minmax(0,1fr)}#beepa-crm-integrated .ic-main{padding:14px}#beepa-crm-integrated .ic-table thead{display:none}#beepa-crm-integrated .ic-table tr{display:grid;grid-template-columns:24px minmax(0,1fr);padding:6px 0;border-bottom:1px solid var(--bc-line)}#beepa-crm-integrated .ic-table td{border:0;padding:3px 5px}#beepa-crm-integrated .ic-table td:nth-child(n+3){grid-column:2}}
@media(max-width:650px){#beepa-crm-integrated .ic-layout,#beepa-crm-integrated .ic-layout.ic-wide{display:block}#beepa-crm-integrated .ic-sidebar{border-right:0;border-bottom:1px solid var(--bc-line);padding:10px 12px}#beepa-crm-integrated .ic-sidebar button{width:auto;margin-right:5px}#beepa-crm-integrated .ic-top{margin-right:70px}#beepa-crm-integrated .rc-layout .rc-chat{display:flex}#beepa-crm-integrated .rc-layout.rc-show-list .rc-chat{display:none}}
</style>
<div class="ic-top"><div><h2>Beepa CRM, connected</h2><p class="bc-muted">Lists → Conversations → Batch review → Response tracking</p></div><small>Interactive preview · Sample data only</small></div>
<div id="ic-app" class="bc-app ic-app"></div>
<div class="ic-demo" aria-label="Preview simulation controls"><small>Demo controls</small><button type="button" data-demo="receipts">Advance sample delivery & read receipts</button><button type="button" data-demo="reply">Simulate Maya’s next reply</button><span id="ic-demo-status" class="bc-design-status" role="status" aria-live="polite">Select Maya and Noah, personalize a batch, then follow their messages here.</span></div>
<script>
(()=>{
const root=document.getElementById('beepa-crm-integrated'),app=root.querySelector('#ic-app');
const people={maya:{name:'Maya Chen',company:'Northstar',routes:{Elliot:{channel:'iMessage',handle:'maya.chen@example.com',state:'ready'},David:{channel:'WhatsApp',handle:'+1 (202) 555-0109',state:'ready'}}},noah:{name:'Noah Patel',company:'Fieldwork',routes:{David:{channel:'WhatsApp',handle:'+1 (202) 555-0142',state:'ready'}}},lena:{name:'Lena Ortiz',company:'Meridian',routes:{Elliot:{channel:'LinkedIn',handle:'linkedin.com/in/lena-ortiz-demo',state:'syncing'}}},sofia:{name:'Sofia Reed',company:'Juniper',routes:{David:{channel:'iMessage',handle:'sofia.reed@example.com',state:'approval'}}},owen:{name:'Owen Park',company:'Alto',routes:{Elliot:{channel:'iMessage',handle:'owen.park@example.com',state:'ready'}}},ada:{name:'Ada Wilson',company:'Elm',routes:{David:{channel:'WhatsApp',handle:'+1 (202) 555-0157',state:'ready'}}}};
const lists=[{name:'Founder introductions',members:{maya:'Elliot',noah:'David',lena:'Elliot',sofia:'David',owen:'Elliot',ada:'David'}},{name:'Follow-ups',members:{maya:'David',owen:'Elliot'}}];
let messages=[{id:'m1',person:'maya',owner:'Elliot',fromMe:true,body:'Great meeting you yesterday. Are you around next week?',time:'Friday, 14:10',receipt:'read',tracked:true},{id:'m2',person:'maya',owner:'Elliot',fromMe:false,body:'Great meeting you too! Yes, I’m around Tuesday and Wednesday.',time:'Friday, 14:16',replyTo:'m1'},{id:'m3',person:'maya',owner:'Elliot',fromMe:true,body:'Would Tuesday at 2 work for a quick catch-up?',time:'10:24',receipt:'read',tracked:true},{id:'m4',person:'maya',owner:'Elliot',fromMe:false,body:'Tuesday works! Send me the details.',time:'10:35',replyTo:'m3'},{id:'m5',person:'maya',owner:'David',fromMe:true,body:'Would you like to meet the team on Thursday?',time:'10:24',receipt:'delivered',tracked:true},{id:'m6',person:'noah',owner:'David',fromMe:true,body:'Would you be up for a quick catch-up next week?',time:'10:20',receipt:'delivered',tracked:true},{id:'m7',person:'lena',owner:'Elliot',fromMe:false,body:'Thanks for connecting. Happy to stay in touch.',time:'Yesterday, 16:40'}];
let jobs=[],counter=7,revision=0;
let s={view:'lists',list:0,selected:['maya','noah'],person:'maya',history:'Elliot',filter:'All users',query:'',info:false,mobileList:false,bodies:{},drafts:{},notice:'',review:null,returnView:'lists',tracking:'All outreach',activeBatch:null};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const current=()=>lists[s.list],sender=id=>current().members[id],route=(id,o=sender(id))=>people[id].routes[o],selected=()=>s.selected.filter(id=>sender(id));
const visible=()=>Object.keys(current().members).filter(id=>(s.filter==='All users'||sender(id)===s.filter)&&people[id].name.toLowerCase().includes(s.query.toLowerCase()));
const check=t=>t?`<span class="bc-check ${t==='read'?'read':''}">${t==='sending'?'✓':'✓✓'}</span>`:'';
const access=r=>r.state==='ready'?'<span class="ic-tag">Direct ready</span>':`<span class="ic-alert">${r.state==='syncing'?'Direct syncing':'Approval to start chat'}</span>`;
const thread=(id,o)=>messages.filter(m=>m.person===id&&m.owner===o),reply=m=>messages.find(x=>x.replyTo===m.id);
const body=id=>s.bodies[id]??`Hi ${people[id].name.split(' ')[0]}, would you be up for a quick catch-up next week? — ${sender(id)}`;
function save(){revision++;window.openai?.setWidgetState?.({modelContent:{view:s.view,list:current().name,contact:people[s.person].name,conversationAccount:s.history},privateContent:{schema:1,revision,view:s.view,list:s.list,person:s.person,history:s.history}})?.catch(()=>{});}
function restore(snapshot){const p=snapshot?.privateContent;if(!p||p.schema!==1||p.revision<=revision)return false;revision=p.revision;if(lists[p.list])s.list=p.list;if(people[p.person])s.person=p.person;if(people[s.person].routes[p.history])s.history=p.history;if(['lists','conversation','tracking'].includes(p.view))s.view=p.view;return true;}
restore(window.openai?.widgetState);
function rail(){return `<nav class="rc-rail" aria-label="Master workspace"><span class="rc-brand">b</span><button type="button" data-nav="lists" aria-label="Contact lists"><i data-lucide="list" aria-hidden="true"></i></button><button type="button" data-nav="conversation" aria-label="Conversations"><i data-lucide="messages-square" aria-hidden="true"></i></button><button type="button" data-nav="tracking" aria-label="Outreach tracking"><i data-lucide="send" aria-hidden="true"></i></button><span class="rc-rail-divider"></span><button type="button" data-filter-button="Elliot" aria-label="Filter Elliot">E</button><button type="button" data-filter-button="David" aria-label="Filter David">D</button><button type="button" data-filter-button="All users" aria-label="All users">All</button></nav>`;}
function nav(){return `<nav class="ic-viewnav" aria-label="Workspace views">${[['lists','Lists'],['conversation','Conversations'],['tracking','Outreach']].map(([v,label])=>`<button type="button" data-nav="${v}" class="${s.view===v?'active':''}">${label}</button>`).join('')}</nav>`;}
function sidebar(){return `<aside class="ic-sidebar"><small>MASTER LISTS</small>${lists.map((l,i)=>`<button type="button" data-list="${i}" class="${s.list===i?'active':''}">${esc(l.name)} <small>${Object.keys(l.members).length}</small></button>`).join('')}<button type="button" data-action="new-list">+ New list</button><div id="ic-new-list"></div></aside>`;}
function render(){app.classList.toggle('rc-app',s.view==='conversation');if(s.view==='lists')renderLists();else if(s.view==='conversation')renderConversation();else if(s.view==='compose')renderCompose();else if(s.view==='review')renderReview();else if(s.view==='add')renderAdd();else renderTracking();app.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));if(globalThis.lucide)lucide.createIcons({attrs:{width:19,height:19}});}
function shell(content,withLists=true){app.innerHTML=`<div class="ic-layout ${withLists?'':'ic-wide'}">${rail()}${withLists?sidebar():''}<main class="ic-main">${nav()}${content}</main></div>`;}
function renderLists(){shell(`<div class="bc-flex bc-between"><div><small>Master / Lists</small><h2>${esc(current().name)}</h2></div><button type="button" data-action="add">+ Add contacts</button></div><div class="bc-tools"><label><small>Find a contact</small><input data-search placeholder="Search this list" value="${esc(s.query)}"></label><label><small>Sender</small><select data-filter>${['All users','Elliot','David'].map(o=>`<option ${o===s.filter?'selected':''}>${o}</option>`).join('')}</select></label></div><div class="ic-info">One master list across users. Click a row to open the regular conversation; checkboxes select recipients for your batch.</div><table class="ic-table"><thead><tr><th></th><th>Contact</th><th>Send from</th><th>Access & last outreach</th></tr></thead><tbody>${visible().map(id=>{const p=people[id],r=route(id),last=thread(id,sender(id)).filter(m=>m.fromMe&&m.tracked).at(-1);return `<tr data-contact="${id}"><td><input type="checkbox" data-check="${id}" aria-label="Select ${p.name}" ${s.selected.includes(id)?'checked':''}></td><td><button type="button" class="ic-link" data-open="${id}" data-owner="${sender(id)}">${p.name}</button><br><small>${p.company}${Object.keys(p.routes).length>1?' · 2 accounts':''}</small></td><td><select data-sender="${id}" aria-label="Send to ${p.name} from">${Object.keys(p.routes).map(o=>`<option ${o===sender(id)?'selected':''}>${o}</option>`).join('')}</select><br><small>${r.channel}</small></td><td>${access(r)}<br><small>${last?`${check(last.receipt)} ${reply(last)?'Replied':'Awaiting reply'}`:'No outreach yet'}</small></td></tr>`;}).join('')}</tbody></table><div class="bc-footer"><small>${selected().length} selected across ${new Set(selected().map(sender)).size} accounts</small><button type="button" data-action="compose" class="primary" ${selected().length?'':'disabled'}>Personalize batch</button></div>`);}
function locations(id){return `<h3>Where we have them</h3>${Object.entries(people[id].routes).map(([o,r])=>`<div class="bc-location"><button type="button" data-history="${o}"><strong>${o} · ${r.channel}</strong></button><p>${esc(r.handle)}</p><small>${r.state==='approval'?'Shared contact · No conversation yet':'Existing conversation'} · ${r.state==='ready'?'Direct':r.state==='syncing'?'Direct syncing':'Approval needed'}</small></div>`).join('')}<span class="bc-label">ON THESE LISTS</span>${lists.map((l,i)=>l.members[id]?`<button type="button" data-list="${i}" style="margin:4px 6px 4px 0">${esc(l.name)} · ${l.members[id]}</button>`:'').join('')}`;}
function renderConversation(){const id=s.person,p=people[id],o=s.history,r=route(id,o),key=id+':'+o,ms=thread(id,o);const bubble=m=>`<div class="rc-message ${m.fromMe?'sent':'received'}"><div class="rc-bubble">${esc(m.body)}<span class="rc-time">${m.time} ${m.fromMe?check(m.receipt):''}</span></div></div>${m.replyTo?`<div class="rc-response-note">Response to ${messages.find(x=>x.id===m.replyTo)?.time||'outreach message'} · <button type="button" class="ic-link" data-action="track-person">View outreach</button></div>`:''}`;
app.innerHTML=`<div class="rc-layout ${s.mobileList?'rc-show-list':''}">${rail()}<section class="rc-list"><header class="rc-list-head"><h3>Conversations</h3><select data-list-select aria-label="Conversation list">${lists.map((l,i)=>`<option value="${i}" ${i===s.list?'selected':''}>${esc(l.name)}</option>`).join('')}</select><input data-search placeholder="Search conversations" aria-label="Search conversations" value="${esc(s.query)}"><button type="button" data-nav="lists">← Back to CRM list</button></header><div class="rc-list-body">${visible().map(x=>{const q=people[x],a=sender(x),last=thread(x,a).at(-1);return `<div class="rc-convo ${x===id?'on':''}"><input type="checkbox" data-check="${x}" aria-label="Select ${q.name}" ${s.selected.includes(x)?'checked':''}><button type="button" class="rc-convo-button" data-open="${x}" data-owner="${a}"><span class="rc-avatar">${q.name.split(' ').map(n=>n[0]).join('')}</span><span class="rc-convo-meta"><span class="rc-convo-title">${q.name}</span><span class="rc-convo-sub">${a} · ${route(x,a).channel}</span><span class="rc-preview">${last?esc(last.body):'No messages yet'}</span></span></button></div>`;}).join('')}</div><div class="rc-batch"><small>${selected().length} selected · Selection kept from your list</small><button type="button" data-action="compose" class="primary" ${selected().length?'':'disabled'}>Personalize batch</button></div></section><section class="rc-chat"><header class="rc-chat-head"><button type="button" class="rc-back" data-action="mobile-back" aria-label="Back to conversations">←</button><div class="rc-heading"><div><strong>${p.name}</strong><span class="rc-owner">${o}</span></div><small>${r.channel} · ${esc(r.handle)}</small><small>${r.state==='ready'?'Direct · Sending through '+o:r.state==='syncing'?'Direct syncing':'User approval required'}</small></div><button type="button" data-action="info" aria-expanded="${s.info}">Contact info</button></header><div class="rc-tabs">${Object.entries(p.routes).map(([a,rt])=>`<button type="button" data-history="${a}" class="${a===o?'on':''}">${a} · ${rt.channel}</button>`).join('')}<button type="button" data-action="track-person">Outreach history</button></div>${s.info?`<section class="rc-info">${locations(id)}<p class="bc-muted" style="margin-top:9px">Batch sender: ${sender(id)||'Not in current list'}. Browsing another conversation does not change it.</p></section>`:''}<div class="rc-messages"><div class="rc-day">Conversation history · Sample data</div>${ms.map(bubble).join('')||`<div class="rc-empty"><strong>No conversation yet</strong><p>${o} must approve starting this conversation.</p></div>`}</div><div class="rc-compose"><div class="rc-compose-mode">${esc(s.notice||'Preview only · Messages are simulated')}</div><div class="rc-compose-row"><input data-chat aria-label="Message in conversation" placeholder="Message" value="${esc(s.drafts[key]||'')}" ${r.state==='syncing'?'disabled':''}><button type="button" data-action="chat-send" class="primary" ${r.state==='syncing'?'disabled':''}>${r.state==='approval'?'Request approval':'Send as '+o}</button></div></div></section></div>`;}
function renderCompose(){shell(`<div class="ic-breadcrumb">${esc(current().name)} / Personalize / Review</div><h2>Personalize across accounts</h2>${selected().map(id=>`<div class="bc-compose-item"><div class="bc-flex bc-between"><h3>${people[id].name}</h3><small>From ${sender(id)} · ${route(id).channel}</small></div><textarea data-body="${id}" aria-label="Message to ${people[id].name}" style="margin-top:9px">${esc(body(id))}</textarea><small>${access(route(id))}</small></div>`).join('')}<div class="bc-footer"><button type="button" data-action="back-compose">Back to ${s.returnView==='conversation'?'conversation':'list'}</button><button type="button" data-action="review" class="primary">Review central batch</button></div>`,false);}
function renderReview(){const items=s.review||[];shell(`<div class="ic-breadcrumb">${esc(current().name)} / Personalize / Review</div><h2>Review central batch</h2><div class="ic-info">${items.filter(i=>i.state==='ready').length} ready · ${items.filter(i=>i.state==='approval').length} need approval · ${items.filter(i=>i.state==='syncing').length} excluded while Direct syncs</div>${['Elliot','David'].map(o=>{const group=items.filter(i=>i.owner===o);return group.length?`<h3 style="margin-top:18px">Send through ${o}</h3>${group.map(i=>`<div class="bc-compose-item"><strong>${people[i.person].name}</strong><p style="margin:8px 0">${esc(i.body)}</p><small>${i.channel} · ${i.state==='ready'?'Direct ready':i.state==='approval'?'Request user approval to start chat':'Not included in submission'}</small></div>`).join('')}`:'';}).join('')}<div class="bc-footer"><button type="button" data-action="compose">Edit messages</button><button type="button" data-action="submit" class="primary" ${items.some(i=>i.state!=='syncing')?'':'disabled'}>Submit batch</button></div>`,false);}
function renderTracking(){const tracked=messages.filter(m=>m.fromMe&&m.tracked&&(s.tracking!=='This contact'||m.person===s.person)&&(s.filter==='All users'||m.owner===s.filter)&&(s.tracking!=='Latest batch'||m.batch===s.activeBatch)).slice().reverse();const pending=jobs.filter(j=>(s.tracking!=='This contact'||j.person===s.person)&&(s.tracking!=='Latest batch'||j.batch===s.activeBatch)&&(s.filter==='All users'||j.owner===s.filter));shell(`<div class="bc-flex bc-between"><div><small>Master / Outreach</small><h2>Messages and responses</h2></div><button type="button" data-nav="lists">Back to lists</button></div><div class="bc-tools"><label><small>Show</small><select data-tracking>${['All outreach','Latest batch','This contact'].map(t=>`<option ${t===s.tracking?'selected':''}>${t}</option>`).join('')}</select></label><label><small>Sender</small><select data-filter>${['All users','Elliot','David'].map(o=>`<option ${o===s.filter?'selected':''}>${o}</option>`).join('')}</select></label></div>${s.notice?`<div class="ic-info">${esc(s.notice)}</div>`:''}<div class="ic-tracking">${tracked.map(m=>{const response=reply(m);return `<article class="ic-outreach-row"><div class="bc-flex bc-between"><button type="button" class="ic-link" data-open="${m.person}" data-owner="${m.owner}">${people[m.person].name}</button><span>${check(m.receipt)} ${m.receipt==='read'?'Read':m.receipt==='delivered'?'Delivered':'Sending'} · ${response?'Replied':'Awaiting reply'}</span></div><small>From ${m.owner} · ${route(m.person,m.owner).channel} · ${m.time}</small><p>${esc(m.body)}</p>${response?`<div class="ic-response"><strong>${people[m.person].name} replied</strong><p>${esc(response.body)}</p><small>Linked to this message · Most recent unanswered outreach</small></div>`:''}<button type="button" data-open="${m.person}" data-owner="${m.owner}">Open conversation</button></article>`;}).join('')}${pending.map(j=>`<article class="ic-outreach-row"><div class="bc-flex bc-between"><strong>${people[j.person].name}</strong><small>${j.state==='approval'?'Awaiting user approval':'Not submitted · Direct syncing'}</small></div><small>From ${j.owner} · ${j.channel}</small><p>${esc(j.body)}</p><button type="button" data-open="${j.person}" data-owner="${j.owner}">Open contact</button></article>`).join('')}${tracked.length+pending.length?'':'<p class="bc-muted">No outreach in this view yet.</p>'}</div>`,false);}
function renderAdd(){shell(`<h2>Add shared contacts</h2><div class="ic-info">Adding a contact enables Direct on the assigned account’s existing conversations, including Private ones. New chats still need approval.</div>${Object.keys(people).filter(id=>!sender(id)).map(id=>`<div class="bc-compose-item bc-flex bc-between"><h3>${people[id].name}</h3><select data-add-owner="${id}" aria-label="Add ${people[id].name} from">${Object.keys(people[id].routes).map(o=>`<option>${o}</option>`).join('')}</select><button type="button" data-add="${id}">Add ${people[id].name}</button></div>`).join('')||'<p class="bc-muted">All shared sample contacts are already in this list.</p>'}<button type="button" data-nav="lists">Back to list</button>`);}
function openConversation(id,o){s.person=id;s.history=o;s.view='conversation';s.mobileList=false;s.notice='';}
function createList(){const name=app.querySelector('#ic-new-list input')?.value.trim();if(!name)return;lists.push({name,members:{}});s.list=lists.length-1;s.selected=[];s.query='';s.filter='All users';s.view='lists';render();save();}
function outgoing(person,owner,body,batch){const m={id:'m'+(++counter),person,owner,fromMe:true,body,time:'Now',receipt:'sending',tracked:true,batch};messages.push(m);return m;}
root.addEventListener('click',e=>{const demo=e.target.closest('[data-demo]');if(demo){let notice='';if(demo.dataset.demo==='receipts'){let n=0;messages.filter(m=>m.fromMe&&m.receipt!=='read').forEach(m=>{m.receipt=m.receipt==='sending'?'delivered':'read';n++;});notice=n?'Sample receipts advanced. The same messages update in lists, conversations and outreach.':'All sample outgoing messages already show read.';}else{let m=messages.filter(x=>x.fromMe&&x.tracked&&x.person==='maya'&&!reply(x)).at(-1);if(m){messages.push({id:'m'+(++counter),person:m.person,owner:m.owner,fromMe:false,body:'Sounds good — happy to join. Send me the details!',time:'Now',replyTo:m.id});notice=`Maya replied through ${m.owner}. Linked only to the most recent unanswered message in that conversation.`;}else notice='Send Maya a sample message first; there is no unanswered outreach to reply to.';}root.querySelector('#ic-demo-status').textContent=notice;render();return;}
const row=e.target.closest('[data-contact]');if(row&&!e.target.closest('button,input,select,label,textarea')){openConversation(row.dataset.contact,sender(row.dataset.contact));render();save();return;}const b=e.target.closest('button');if(!b)return;
if(b.dataset.nav){s.view=b.dataset.nav;if(s.view==='tracking'){s.tracking='All outreach';s.filter='All users';s.notice='';}if(s.view==='conversation'&&!s.person){s.person='maya';s.history='Elliot';}}
else if(b.dataset.list!==undefined){s.list=Number(b.dataset.list);s.view='lists';s.selected=[];s.bodies={};s.review=null;s.filter='All users';s.query='';}
else if(b.dataset.open)openConversation(b.dataset.open,b.dataset.owner);
else if(b.dataset.history){s.history=b.dataset.history;s.notice='';}
else if(b.dataset.filterButton)s.filter=b.dataset.filterButton;
else if(b.dataset.add){const id=b.dataset.add;current().members[id]=app.querySelector(`[data-add-owner="${id}"]`).value;s.view='lists';}
else if(b.dataset.action){const a=b.dataset.action;if(a==='info')s.info=!s.info;else if(a==='mobile-back')s.mobileList=true;else if(a==='track-person'){s.view='tracking';s.tracking='This contact';s.filter='All users';s.notice='';}else if(a==='new-list'){app.querySelector('#ic-new-list').innerHTML='<div class="ic-new-list"><input aria-label="New list name" maxlength="40" placeholder="List name"><button type="button" data-action="create-list">Create</button></div>';return;}else if(a==='create-list'){createList();return;}else if(a==='add')s.view='add';else if(a==='compose'){if(!['compose','review'].includes(s.view))s.returnView=s.view;s.view='compose';s.review=null;}else if(a==='back-compose')s.view=s.returnView;else if(a==='review'){if(selected().some(id=>!body(id).trim())){root.querySelector('#ic-demo-status').textContent='Every selected contact needs a message.';return;}s.review=selected().map(id=>({person:id,owner:sender(id),channel:route(id).channel,state:route(id).state,body:body(id)}));s.view='review';}else if(a==='submit'){const batch='batch-'+(++counter);s.activeBatch=batch;for(const item of s.review||[]){if(item.state==='ready')outgoing(item.person,item.owner,item.body,batch);else jobs.push({...item,batch});}s.review=null;s.view='tracking';s.tracking='Latest batch';s.filter='All users';s.notice='Batch submitted in the preview. Track each account here; no real messages were sent.';}else if(a==='chat-send'){const key=s.person+':'+s.history,text=s.drafts[key]?.trim(),r=route(s.person,s.history);if(!text||r.state==='syncing')return;if(r.state==='approval'){jobs.push({person:s.person,owner:s.history,channel:r.channel,state:'approval',body:text});s.notice='Approval requested · Preview only';}else{outgoing(s.person,s.history,text);s.notice='Simulated message added to this conversation and outreach tracking.';}s.drafts[key]='';}}else return;render();save();});
root.addEventListener('change',e=>{const t=e.target;if(t.dataset.check){s.selected=t.checked?[...new Set([...s.selected,t.dataset.check])]:s.selected.filter(id=>id!==t.dataset.check);}else if(t.dataset.sender){current().members[t.dataset.sender]=t.value;delete s.bodies[t.dataset.sender];s.review=null;}else if(t.hasAttribute('data-filter'))s.filter=t.value;else if(t.hasAttribute('data-tracking'))s.tracking=t.value;else if(t.hasAttribute('data-list-select')){s.list=Number(t.value);s.selected=[];s.query='';s.filter='All users';s.review=null;}else return;render();save();});
root.addEventListener('input',e=>{if(e.target.dataset.body)s.bodies[e.target.dataset.body]=e.target.value;if(e.target.hasAttribute('data-chat'))s.drafts[s.person+':'+s.history]=e.target.value;if(e.target.hasAttribute('data-search')){s.query=e.target.value;const pos=e.target.selectionStart;render();const input=app.querySelector('[data-search]');input.focus();input.setSelectionRange(pos,pos);}});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('#ic-new-list')){e.preventDefault();createList();}else if(e.key==='Enter'&&e.target.hasAttribute('data-chat')){e.preventDefault();app.querySelector('[data-action="chat-send"]')?.click();}});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){if(restore(e.detail.globals.widgetState))render();}});
render();
})();
</script>
</div>
