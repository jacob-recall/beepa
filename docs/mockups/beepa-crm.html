<style>
#beepa-crm-preview{--bp-bg:light-dark(#f6f8f7,#151c1c);--bp-panel:light-dark(#fff,#1d2626);--bp-text:light-dark(#182c2b,#e4eeee);--bp-sub:light-dark(#5a6d6b,#a6b9b5);--bp-line:light-dark(#dce6e3,#354440);--bp-accent:light-dark(#126b59,#91d6be);--bp-tint:light-dark(#e4f3ed,#263e35);--bp-button:light-dark(#126b59,#91d6be);--bp-on:light-dark(#fff,#112e26);--bp-blue:light-dark(#126abb,#75b8ff);--bp-warn:light-dark(#805a18,#ecc58a);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--bp-text);background:var(--bp-bg);border:1px solid var(--bp-line);border-radius:14px;overflow:hidden}

iew .bp-label{display:block;font-size:12px;color:var(--bp-sub);margin-bottom:7px}#beepa-crm-preview .bp-account{width:100%;margin-bottom:23px}#beepa-crm-preview .bp-lists{display:grid;gap:6px;margin:8px 0 15px}#beepa-crm-preview .bp-lists button{text-align:left;display:flex;justify-content:space-between;gap:6px}#beepa-crm-preview main{min-width:0;padding:24px}#beepa-crm-preview .bp-header{margin-bottom:19px}#beepa-crm-preview .bp-note{border-radius:8px;background:var(--bp-tint);color:var(--bp-accent);padding:11px 13px;margin:15px 0;font-size:13px}#beepa-crm-preview .bp-table{width:100%;border-collapse:collapse}#beepa-crm-preview th{text-align:left;color:var(--bp-sub);font-size:12px;font-weight:500;padding:10px 8px;border-bottom:1px solid var(--bp-line)}#beepa-crm-preview td{padding:6px 8px;border-bottom:1px solid var(--bp-line);vertical-align:middle}#beepa-crm-preview.compact td{padding-top:9px;padding-bottom:9px}#beepa-crm-preview .bp-person{display:flex;align-items:center;gap:10px}#beepa-crm-preview .bp-avatar{display:grid;place-items:center;flex-shrink:0;width:28px;height:28px;border-radius:8px;background:var(--bp-tint);color:var(--bp-accent);font-weight:600;font-size:12px}#beepa-crm-preview .bp-link{padding:0;border:0;background:none;text-align:left;color:var(--bp-text);font-weight:600}#beepa-crm-preview .bp-pill{display:inline-block;border-radius:5px;padding:3px 7px;font-size:12px;background:var(--bp-tint);color:var(--bp-accent)}#beepa-crm-preview .bp-warn{color:var(--bp-warn)}#beepa-crm-preview .bp-check{color:var(--bp-sub);font-size:16px;white-space:nowrap}#beepa-crm-preview .bp-check.blue{color:var(--bp-blue)}#beepa-crm-preview .bp-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:18px}#beepa-crm-preview .bp-panel{background:var(--bp-panel);border:1px solid var(--bp-line);border-radius:9px;padding:16px;margin:13px 0}#beepa-crm-preview .bp-message{background:var(--bp-tint);padding:13px;border-radius:10px;margin-top:12px}#beepa-crm-preview .bp-reply{border-left:3px solid var(--bp-accent);margin:10px 0 0 17px;padding:8px 12px}#beepa-crm-preview .bp-fields{display:grid;gap:14px;margin-top:18px}#beepa-crm-preview .bp-steps{color:var(--bp-sub);font-size:12px;margin-bottom:16px}#beepa-crm-preview .bp-steps strong{color:var(--bp-accent)}#beepa-crm-preview .bp-ledger{display:grid;gap:12px}#beepa-crm-preview .bp-ledger button{text-align:left;padding:15px}#beepa-crm-preview .bp-banner{padding:8px 22px;background:var(--bp-tint);font-size:12px;color:var(--bp-accent)}#beepa-crm-preview .bp-search{width:210px}#beepa-crm-preview .bp-empty{padding:32px 0;color:var(--bp-sub)}#beepa-crm-preview .bp-status{font-size:12px;margin-top:8px;min-height:18px;color:var(--bp-accent)}#beepa-crm-preview .bp-inline-form{display:flex;gap:7px;margin:9px 0;flex-wrap:wrap}#beepa-crm-preview .bp-inline-form input{width:130px}#beepa-crm-preview .bp-remove{margin-top:20px;font-size:12px;color:var(--bp-sub)}
@media(max-width:760px){#beepa-crm-preview .bp-shell{grid-template-columns:155px minmax(0,1fr)}#beepa-crm-preview main{padding:18px 14px}#beepa-crm-preview .bp-table thead{display:none}#beepa-crm-preview .bp-table tr{display:grid;grid-template-columns:30px minmax(0,1fr);padding:10px 0;border-bottom:1px solid var(--bp-line)}#beepa-crm-preview .bp-table td{border:0;padding:4px 5px}#beepa-crm-preview .bp-table td:nth-child(n+3){grid-column:2}#beepa-crm-preview .bp-table td:nth-child(3)::before{content:'Send from · ';color:var(--bp-sub)}#beepa-crm-preview .bp-table td:nth-child(4)::before{content:'Status · ';color:var(--bp-sub)}}
@media(max-width:480px){#beepa-crm-preview .bp-top{gap:6px;padding:12px 100px 12px 14px}#beepa-crm-preview .bp-top nav{flex-wrap:wrap}#beepa-crm-preview .bp-top nav button{padding:5px 8px}#beepa-crm-preview .bp-shell{display:block}#beepa-crm-preview aside{border-right:0;border-bottom:1px solid var(--bp-line);padding:12px 14px}#beepa-crm-preview .bp-account{margin-bottom:10px}#beepa-crm-preview .bp-lists{display:flex;flex-wrap:wrap;margin:5px 0 10px}#beepa-crm-preview .bp-header{align-items:flex-start}#beepa-crm-preview .bp-search{width:100%}#beepa-crm-preview h2{font-size:21px}#beepa-crm-preview .bp-banner{padding:8px 14px}#beepa-crm-preview .bp-panel{padding:12px}}@media(pointer:coarse){#beepa-crm-preview button{min-height:44px}#beepa-crm-preview input,#beepa-crm-preview textarea,#beepa-crm-preview select{font-size:16px}}

#beepa-crm-preview .bp-contact-row{line-height:1.35}
#beepa-crm-preview .bp-contact-row:hover,#beepa-crm-preview .bp-contact-row:focus-within{background:var(--bp-tint)}
#beepa-crm-preview .bp-contact-row select{padding:3px 7px;font-size:13px}

#beepa-crm-preview .bp-thread{background:var(--bp-panel);border:1px solid var(--bp-line);border-radius:9px;padding:16px}
#beepa-crm-preview .bp-conversation{display:block;width:100%;text-align:left;margin:7px 0;padding:10px}

#beepa-crm-preview .bp-memberships{display:grid;gap:7px;margin-top:10px}
#beepa-crm-preview .bp-memberships button{text-align:left;padding:8px 10px}
#beepa-crm-preview .bp-memberships span{display:block;margin-top:3px}
#beepa-crm-preview .bp-thread small{overflow-wrap:anywhere}
@media(max-width:760px){#beepa-crm-preview .bp-table tr{padding:4px 0}#beepa-crm-preview .bp-table td{padding:2px 5px}#beepa-crm-preview .bp-contact-detail{grid-template-columns:minmax(0,1fr)}}

</style>
<div class="bp-banner">Design preview · Sample contacts · Sends are simulated</div>
<header class="bp-top"><span class="bp-brand">beepa</span><nav aria-label="CRM views"><button type="button" data-view="list" class="active cursor-interaction">Contact lists</button><button type="button" data-view="outreach" class="cursor-interaction">Outreach</button></nav><small>Master workspace</small></header>
<div class="bp-shell"><aside><label class="bp-label" for="bp-owner">FILTER BY SENDER</label><select id="bp-owner" class="bp-account"><option>All accounts</option><option>Elliot</option><option>David</option></select><div class="bp-label">MASTER LISTS</div><div class="bp-lists" id="bp-lists"></div><button type="button" id="bp-new-list" class="cursor-interaction">+ New list</button><div id="bp-list-form"></div><p class="bp-muted" style="margin-top:20px">One list across your users. Choose the sender for each contact.</p></aside><main id="bp-main"></main></div>
<div id="bp-announcement" class="bp-banner" role="status" aria-live="polite">Master workspace · One list, multiple sending accounts</div>
<script>
(()=>{
const root=document.getElementById('beepa-crm-preview'),main=root.querySelector('#bp-main');
const people={
 maya:{name:'Maya Chen',company:'Northstar',routes:{Elliot:{channel:'iMessage',state:'ready',receipt:'read',response:'Replied'},David:{channel:'WhatsApp',state:'ready',receipt:'delivered',response:'Awaiting response'}}},
 noah:{name:'Noah Patel',company:'Fieldwork',routes:{David:{channel:'WhatsApp',state:'ready',receipt:'delivered',response:'Awaiting response'}}},
 lena:{name:'Lena Ortiz',company:'Meridian',routes:{Elliot:{channel:'LinkedIn',state:'syncing',receipt:null,response:'No outreach yet'}}},
 sofia:{name:'Sofia Reed',company:'Juniper',routes:{David:{channel:'iMessage',state:'approval',receipt:null,response:'No conversation yet'}}},
 owen:{name:'Owen Park',company:'Alto',routes:{Elliot:{channel:'iMessage',state:'ready',receipt:'sending',response:'Awaiting response'}}}
};
let lists=[{name:'Founder introductions',members:{maya:'Elliot',noah:'David',lena:'Elliot',sofia:'David'}},{name:'Follow-ups',members:{maya:'David',owen:'Elliot'}}];
let batches=[],revision=0,s={filter:'All accounts',list:0,view:'list',selected:['maya','noah'],person:'maya',historyOwner:'Elliot',bodies:{},query:'',notice:''};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const current=()=>lists[s.list];const owner=id=>current().members[id];const route=id=>people[id].routes[owner(id)];
const ids=()=>Object.keys(current().members);const selected=()=>s.selected.filter(id=>owner(id));
const visible=()=>ids().filter(id=>(s.filter==='All accounts'||owner(id)===s.filter)&&people[id].name.toLowerCase().includes(s.query.toLowerCase()));
const body=id=>s.bodies[id]??`Hi ${people[id].name.split(' ')[0]}, would you be up for a quick catch-up next week? — ${owner(id)}`;
const checks=t=>t?`<span class="bp-check ${t==='read'?'blue':''}" aria-label="${t}">${t==='sending'?'✓':'✓✓'}</span>`:'';
const access=r=>r.state==='ready'?'<span class="bp-pill">Direct ready</span>':r.state==='syncing'?'<span class="bp-warn">Direct syncing</span>':'<span class="bp-warn">Approval to start chat</span>';
function restore(snapshot,initial=false){const p=snapshot?.privateContent;if(!p||p.schema!==2||(!initial&&p.revision<=revision))return;revision=p.revision||0;if(['All accounts','Elliot','David'].includes(p.filter))s.filter=p.filter;if(Number.isInteger(p.list)&&lists[p.list])s.list=p.list;if(['list','outreach','detail','compose','review','result','add'].includes(p.view))s.view=p.view;if(people[p.person])s.person=p.person;if(people[s.person].routes[p.historyOwner])s.historyOwner=p.historyOwner;if(Array.isArray(p.selected))s.selected=p.selected.filter(id=>owner(id));}
restore(window.openai?.widgetState,true);
function save(){revision++;window.openai?.setWidgetState?.({modelContent:{list:current().name,filter:s.filter,view:s.view,sendingAccounts:[...new Set(selected().map(owner))]},privateContent:{schema:2,revision,filter:s.filter,list:s.list,view:s.view,selected:s.selected,person:s.person,historyOwner:s.historyOwner}})?.catch(()=>{});}
function senderSelect(id){return `<select data-sender="${id}" aria-label="Send to ${people[id].name} from">${Object.keys(people[id].routes).map(o=>`<option ${o===owner(id)?'selected':''}>${o}</option>`).join('')}</select>`;}
function render(){root.querySelector('#bp-owner').value=s.filter;root.querySelector('#bp-lists').innerHTML=lists.map((l,i)=>`<button type="button" data-list="${i}" class="${s.list===i?'active':''}">${esc(l.name)} <small>${Object.keys(l.members).length}</small></button>`).join('');root.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===(s.view==='outreach'?'outreach':'list')));({list:renderList,compose:renderCompose,review:renderReview,result:renderResult,detail:renderDetail,add:renderAdd,outreach:renderOutreach}[s.view]||renderList)();root.querySelector('#bp-announcement').textContent=s.notice||'Master workspace · Shared contacts only · Direct enabled for the assigned sending account';root.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));}
function renderList(){const v=visible();main.innerHTML=`<div class="bp-row bp-between bp-header"><div><small>Master / Contact lists</small><h2>${esc(current().name)}</h2></div><button type="button" data-act="add">+ Add contacts</button></div><div class="bp-row bp-between"><label><span class="bp-label">Find a contact</span><input id="bp-search" class="bp-search" placeholder="Search this list" value="${esc(s.query)}"></label><small>${ids().length} people · ${new Set(ids().map(owner)).size} sending accounts</small></div><div class="bp-note">One central list. Every message goes through the sending account shown below.</div><table class="bp-table"><thead><tr><th><input type="checkbox" id="bp-all" aria-label="Select visible contacts" ${v.length&&v.every(id=>s.selected.includes(id))?'checked':''}></th><th>Contact</th><th>Send from</th><th>Access & last outreach</th></tr></thead><tbody>${v.map(id=>{const p=people[id],r=route(id);return `<tr class="bp-contact-row cursor-interaction" data-row-person="${id}" data-owner="${owner(id)}"><td><input type="checkbox" data-select="${id}" aria-label="Select ${p.name}" ${s.selected.includes(id)?'checked':''}></td><td><div class="bp-person"><span class="bp-avatar">${p.name.split(' ').map(n=>n[0]).join('')}</span><div><button type="button" class="bp-link" data-person="${id}" data-owner="${owner(id)}">${p.name}</button><br><small>${p.company}${Object.keys(p.routes).length>1?' · Shared by 2 users':''}</small></div></div></td><td>${senderSelect(id)}<br><small>${r.channel}</small></td><td>${access(r)}<br><small>${checks(r.receipt)} ${r.response}</small></td></tr>`;}).join('')}</tbody></table>${v.length?'':'<p class="bp-empty">No matching contacts.</p>'}<div class="bp-footer"><small>${selected().length} selected across ${new Set(selected().map(owner)).size} accounts${selected().some(id=>!v.includes(id))?' · Selection includes hidden rows':''}</small><button type="button" class="primary" data-act="compose" ${selected().length?'':'disabled'}>Personalize messages →</button></div>`;}
function renderCompose(){main.innerHTML=`<div class="bp-steps">1 Select contacts / <strong>2 Personalize</strong> / 3 Review</div><div class="bp-row bp-between"><h2>Compose across accounts</h2><button type="button" data-act="list">Back to list</button></div><p class="bp-muted" style="margin-top:8px">Each person receives one message from their selected sender.</p>${selected().map(id=>`<div class="bp-panel"><div class="bp-row bp-between"><h3>${people[id].name}</h3><small>From ${owner(id)} · ${route(id).channel}</small></div><div style="margin:10px 0">${access(route(id))}</div><textarea data-body="${id}" aria-label="Message to ${people[id].name}">${esc(body(id))}</textarea></div>`).join('')}<div class="bp-footer"><small>${selected().length} recipients · One central batch</small><button type="button" class="primary" data-act="review">Review batch →</button></div>`;}
function groups(){return ['Elliot','David'].map(o=>({owner:o,ids:selected().filter(id=>owner(id)===o)})).filter(g=>g.ids.length);}
function renderReview(){const ready=selected().filter(id=>route(id).state==='ready').length,approval=selected().filter(id=>route(id).state==='approval').length,pending=selected().length-ready-approval;main.innerHTML=`<div class="bp-steps">1 Select contacts / 2 Personalize / <strong>3 Review</strong></div><h2>Review central batch</h2><div class="bp-note">${ready} ready to send · ${approval} need approval · ${pending} waiting for Direct</div>${groups().map(g=>`<section class="bp-panel"><div class="bp-row bp-between"><h3>Send through ${g.owner}</h3><small>${g.ids.length} recipients</small></div>${g.ids.map(id=>`<div class="bp-message"><div class="bp-row bp-between"><strong>${people[id].name}</strong><small>${route(id).channel}</small></div><p style="margin:8px 0">${esc(body(id))}</p>${access(route(id))}${route(id).state==='syncing'?'<p class="bp-muted">Excluded until Direct is confirmed.</p>':route(id).state==='approval'?`<p class="bp-muted">${owner(id)} must approve starting this conversation.</p>`:''}</div>`).join('')}</section>`).join('')}<div class="bp-footer"><button type="button" data-act="compose">Edit messages</button><button type="button" class="primary" data-act="send" ${ready+approval?'':'disabled'}>Submit ${ready+approval} items across ${groups().filter(g=>g.ids.some(id=>route(id).state!=='syncing')).length} accounts</button></div><p class="bp-status">Each user’s account checks permissions again before sending.</p>`;}
function renderResult(){const batch=batches[batches.length-1];main.innerHTML=`<small>Master / ${esc(current().name)}</small><h2>Central batch submitted</h2><div class="bp-note">Simulated only · Track every account here, without switching logins.</div>${['Elliot','David'].map(o=>{const items=(batch?.items||[]).filter(i=>i.owner===o);return items.length?`<div class="bp-panel"><h3>${o}</h3>${items.map(i=>`<div class="bp-row bp-between" style="margin-top:12px"><span>${people[i.id].name}</span><small>${i.state==='ready'?'✓ Sending':i.state==='approval'?'Awaiting user approval':'Not submitted · Direct syncing'}</small></div>`).join('')}</div>`:'';}).join('')}<div class="bp-footer"><button type="button" data-act="list">Back to list</button><button type="button" class="primary" data-act="outreach">Track all messages</button></div>`;}
function renderOutreach(){const fresh=batches.flatMap(b=>b.items).filter(i=>i.state!=='syncing'&&(s.filter==='All accounts'||s.filter===i.owner));const sample=[{id:'maya',owner:'Elliot'},{id:'maya',owner:'David'},{id:'noah',owner:'David'}].filter(i=>s.filter==='All accounts'||s.filter===i.owner);main.innerHTML=`<div class="bp-header"><small>Master / All outreach</small><h2>Every account, every response</h2></div><div class="bp-ledger">${fresh.map(i=>`<div class="bp-panel"><div class="bp-row bp-between"><h3>${people[i.id].name}</h3><span>${i.state==='ready'?'✓ Sending':'Awaiting user approval'}</span></div><p style="margin:8px 0">${esc(i.body)}</p><small>From ${i.owner} · ${people[i.id].routes[i.owner].channel} · Just submitted · Simulated</small></div>`).join('')}${sample.map(i=>{const r=people[i.id].routes[i.owner];return `<button type="button" data-person="${i.id}" data-owner="${i.owner}"><div class="bp-row bp-between"><h3>${people[i.id].name}</h3><span>${checks(r.receipt)} ${r.response}</span></div><p style="margin:8px 0">${i.owner==='Elliot'?'Would Tuesday at 2 work for a catch-up?':'Would you like to meet the team on Thursday?'}</p><small>From ${i.owner} · ${r.channel} · Open message and response</small></button>`;}).join('')}</div>`;}
function renderDetail(){
 const p=people[s.person],o=s.historyOwner,r=p.routes[o];
 const memberships=lists.map((l,i)=>({list:l,index:i})).filter(x=>x.list.members[s.person]);
 const handles={maya:{Elliot:'maya.chen@example.com',David:'+1 (202) 555-0109'},noah:{David:'+1 (202) 555-0142'},lena:{Elliot:'linkedin.com/in/lena-ortiz-demo'},sofia:{David:'sofia.reed@example.com'},owen:{Elliot:'owen.park@example.com'}};
 main.innerHTML=`<button type="button" data-act="list">← Contact list</button>
 <div class="bp-row bp-between" style="margin-top:16px"><div><h2>${p.name}</h2><small>${p.company} · ${Object.keys(p.routes).length} connected account${Object.keys(p.routes).length===1?'':'s'}</small></div><span class="bp-pill">${memberships.length} master list${memberships.length===1?'':'s'}</span></div>
 <div class="bp-contact-detail">
 <section class="bp-locations" aria-label="Where we have this contact"><h3>Where we have them</h3><p class="bp-muted" style="margin:5px 0 12px">Shared accounts & conversations</p>
 ${Object.entries(p.routes).map(([account,rt])=>`<button type="button" class="bp-conversation ${account===o?'active':''}" data-conversation="${account}" aria-pressed="${account===o}"><span class="bp-row bp-between"><strong>${account}</strong><small>${rt.channel}</small></span><span class="bp-handle">${esc(handles[s.person][account])}</span><span class="bp-muted">${rt.state==='approval'?'Shared contact · No conversation yet':'Open conversation'} · ${rt.state==='ready'?'Direct':rt.state==='syncing'?'Direct syncing':'Approval needed'}</span></button>`).join('')}
 <h3 style="margin-top:20px">On these lists</h3><div class="bp-memberships">${memberships.map(x=>`<button type="button" data-list="${x.index}"><strong>${esc(x.list.name)}</strong><span class="bp-muted">Sends through ${x.list.members[s.person]}</span></button>`).join('')||'<p class="bp-muted">Not on a master list.</p>'}</div></section>
 <section class="bp-thread" aria-label="Selected conversation"><div class="bp-row bp-between"><div><h3>${o} ↔ ${p.name}</h3><small>${r.channel} · ${esc(handles[s.person][o])}</small></div>${access(r)}</div>
 <p class="bp-muted" style="margin-top:8px">History with ${o} · Viewing this conversation does not change your sending account.</p>
 ${r.receipt?`<div class="bp-message"><small>${o} → ${p.name} · Today, 10:24</small><p style="margin:8px 0">${o==='Elliot'?'Would Tuesday at 2 work for a catch-up?':'Would you like to meet the team on Thursday?'}</p>${checks(r.receipt)} <small>${r.receipt==='read'?'Read at 10:31':r.receipt==='delivered'?'Delivered':'Sending'}</small></div>${s.person==='maya'&&o==='Elliot'?'<div class="bp-reply"><small>Maya · 10:35</small><p>Tuesday works! Send me the details.</p><small>Response to most recent unanswered message</small></div><div class="bp-message"><small>Elliot → Maya · Friday</small><p>Great meeting you. Are you around next week?</p><small><span class="bp-check blue">✓✓</span> Read · No linked response</small></div>':'<p class="bp-muted" style="margin-top:12px">Awaiting response to this message</p>'}`:r.state==='approval'?`<div class="bp-empty"><p>No conversation yet.</p><p class="bp-muted">${o} shared this contact. Starting a conversation still needs their approval.</p></div>`:`<div class="bp-reply"><small>${p.name} · Yesterday, 16:40</small><p>Thanks for connecting. Happy to stay in touch.</p></div><p class="bp-muted" style="margin-top:12px">Existing conversation · No CRM outreach yet.</p>`}
 <p class="bp-muted" style="margin-top:18px">✓ Sending · ✓✓ Delivered · <span class="bp-check blue">✓✓</span> Read</p>
 </section></div>
 ${owner(s.person)?`<button type="button" class="bp-remove" data-act="remove">Remove from ${esc(current().name)}</button><p class="bp-muted">Direct remains enabled until changed manually.</p>`:''}`;
}
function renderAdd(){const available=Object.keys(people).filter(id=>!owner(id));main.innerHTML=`<h2>Add shared contacts</h2><div class="bp-note">Choose contacts from any connected user. Adding a contact enables Direct on the assigned user’s existing conversations, including Private ones. New conversations still need approval.</div>${available.map(id=>`<div class="bp-panel"><div class="bp-row bp-between"><div><h3>${people[id].name}</h3><small>${people[id].company}</small></div><label><span class="bp-label">Send from</span><select data-add-route="${id}" aria-label="Add ${people[id].name} from">${Object.keys(people[id].routes).map(o=>`<option>${o}</option>`).join('')}</select></label><button type="button" data-add="${id}">Add ${people[id].name}</button></div></div>`).join('')||'<p class="bp-empty">All shared sample contacts are already in this list.</p>'}<button type="button" data-act="list">Back to list</button>`;}
function createList(){const name=root.querySelector('#bp-list-form input')?.value.trim();if(!name)return;lists.push({name,members:{}});s.list=lists.length-1;s.selected=[];s.filter='All accounts';s.view='list';s.notice='Master list created · Add contacts from any user';root.querySelector('#bp-list-form').innerHTML='';render();save();}
root.addEventListener('click',e=>{const row=e.target.closest('[data-row-person]');if(row&&!e.target.closest('button,input,select,textarea,label,a')){s.person=row.dataset.rowPerson;s.historyOwner=row.dataset.owner;s.view='detail';s.notice='';render();save();return;}const b=e.target.closest('button');if(!b)return;s.notice='';if(b.dataset.list!==undefined){s.list=Number(b.dataset.list);s.selected=[];s.view='list';s.query='';s.bodies={};}else if(b.dataset.conversation){s.historyOwner=b.dataset.conversation;}else if(b.dataset.view)s.view=b.dataset.view;else if(b.dataset.person){s.person=b.dataset.person;s.historyOwner=b.dataset.owner;s.view='detail';}else if(b.id==='bp-new-list'){root.querySelector('#bp-list-form').innerHTML='<div class="bp-inline-form"><input aria-label="New list name" maxlength="40" placeholder="List name"><button type="button" data-act="create">Create</button></div>';return;}else if(b.dataset.add){const id=b.dataset.add;current().members[id]=root.querySelector(`[data-add-route="${id}"]`).value;s.notice=`${people[id].name} added · Sending account: ${owner(id)}`;s.view='list';}else if(b.dataset.act){const a=b.dataset.act;if(a==='create'){createList();return;}if(a==='review'&&selected().some(id=>!body(id).trim())){s.notice='Every selected person needs a message.';root.querySelector('#bp-announcement').textContent=s.notice;return;}if(a==='send'){batches.push({items:selected().map(id=>({id,owner:owner(id),state:route(id).state,body:body(id)}))});s.view='result';}else if(a==='remove'){delete current().members[s.person];s.selected=s.selected.filter(id=>id!==s.person);s.notice='Removed from this master list · Direct stays enabled';s.view='list';}else s.view=a;}else return;render();save();});
root.addEventListener('change',e=>{const t=e.target;if(t.id==='bp-owner')s.filter=t.value;else if(t.id==='bp-history')s.historyOwner=t.value;else if(t.dataset.sender){const id=t.dataset.sender;current().members[id]=t.value;delete s.bodies[id];s.notice=`${people[id].name} will receive one message from ${t.value}. Review the updated text before sending.`;}else if(t.dataset.select)s.selected=t.checked?[...new Set([...s.selected,t.dataset.select])]:s.selected.filter(id=>id!==t.dataset.select);else if(t.id==='bp-all'){const v=visible();s.selected=t.checked?[...new Set([...s.selected,...v])]:s.selected.filter(id=>!v.includes(id));}else return;render();save();});
root.addEventListener('input',e=>{if(e.target.dataset.body)s.bodies[e.target.dataset.body]=e.target.value;if(e.target.id==='bp-search'){s.query=e.target.value;const pos=e.target.selectionStart;render();const input=root.querySelector('#bp-search');input.focus();input.setSelectionRange(pos,pos);}});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('#bp-list-form')){e.preventDefault();createList();}});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
render();
})();
</script>
</div>
