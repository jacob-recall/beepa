server {
    listen 80;
    server_name _;
    server_tokens off;
    autoindex off;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://127.0.0.1:8008; img-src 'self' blob:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; frame-src http://127.0.0.1:8009; require-trusted-types-for 'script'; trusted-types 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), display-capture=(), clipboard-read=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }
}
