# Security headers for the `views` static server (127.0.0.1:8011).
#
# Serves two apps out of one root:
#   /apps/user/    -> ./apps/user      (talks to the local hub Synapse :8008,
#                                       uplink :8019, embeds Element :8009)
#   /apps/master/  -> ./apps/master    (talks to the master Synapse :8018,
#                                       uplink :8019, no iframes)
#   /shared/       -> ./shared         (ES modules + CSS only, no documents)
#
# Each app's Content-Security-Policy below is a byte-for-byte copy of that
# app's own <meta http-equiv="Content-Security-Policy"> in index.html. The
# <meta> stays in place as defense in depth; the header exists because
# `frame-ancestors` (and X-Frame-Options) are IGNORED in <meta> by browsers.
# If you change one, change the other. The two policies are deliberately
# different — do not merge them into a single inherited header.
#
# nginx footgun: `add_header` in a location cancels EVERY inherited
# add_header. So each location below repeats the complete header set.

server {
    listen 80;
    server_name _;
    server_tokens off;
    autoindex off;
    root /usr/share/nginx/html;
    index index.html;

    # --- teammate app -------------------------------------------------
    location /apps/user/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://127.0.0.1:8008 http://127.0.0.1:8019; img-src 'self' blob:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; frame-src http://127.0.0.1:8009; require-trusted-types-for 'script'; trusted-types 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), display-capture=(), clipboard-read=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }

    # --- manager's read-only console ----------------------------------
    location /apps/master/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://127.0.0.1:8018 http://127.0.0.1:8019; img-src 'self' blob:; media-src 'self' blob:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), display-capture=(), clipboard-read=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }

    # --- /shared/ assets and everything else --------------------------
    # No HTML documents are served here, so the CSP is only a backstop for
    # anything accidentally rendered as a document: allow nothing at all.
    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), display-capture=(), clipboard-read=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }
}
